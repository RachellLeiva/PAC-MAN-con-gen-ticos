<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pacman - Algoritmo Genético</title>
  <style>
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5rem;
      color: #ffeb3b;
      text-shadow: 0 0 10px #ffeb3b;
    }

    #ui {
      margin-bottom: 20px;
      text-align: center;
      font-size: 1.2rem;
    }

    #puntuacion {
      color: #ffeb3b;
      margin-right: 20px;
    }

    #estado {
      color: #00ff00;
    }

    .game {
      display: grid;
      background: #000;
      padding: 10px;
      border-radius: 20px;
      border: 4px solid #004bff;
      box-shadow: 0 0 25px #004bff;
    }

    .tile { width: 20px; height: 20px; position: relative; }
    .wall { background: #001b99; border-radius: 6px; box-shadow: 0 0 6px #004bff inset; }
    .path { background: #000; }
    .path .dot {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: #fff; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .pellet-especial {
      position: absolute; 
      width: 10px; 
      height: 10px; 
      border-radius: 50%;
      background: #fff; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px #fff;
    }
    .empty { background: #000; }
    .pacman {
      width: 20px; height: 20px; background: #ffeb3b; border-radius: 50%;
    }
    
    .ghost {
      position: relative; border-radius: 50% 50% 10% 10%;
      width: 100%; height: 100%; overflow: hidden;
    }
    .ghost::before {
      content: ''; position: absolute; width: 100%; height: 50%;
      background: inherit; bottom: 0;
      clip-path: polygon(0 60%, 12% 100%, 25% 60%, 37% 100%, 50% 60%, 62% 100%, 75% 60%, 87% 100%, 100% 60%);
    }
    .ghost.vulnerable {
      background: #0000ff !important;
      animation: parpadeo 0.5s infinite;
    }
    .ghost-eye {
      position: absolute; top: 4px; width: 6px; height: 6px;
      background: #fff; border-radius: 50%;
    }
    .ghost-eye::after {
      content: ''; position: absolute; width: 3px; height: 3px;
      background: #00f; border-radius: 50%; top: 1px; left: 1px;
    }
    .ghost.ojos {
      background: transparent !important;
      border: 2px solid white;
    }

    .ghost.ojos::before {
      display: none;
    }

    .ghost.ojos .ghost-eye {
      background: white;
      width: 8px;
      height: 8px;
    }

    .ghost.ojos .ghost-eye::after {
      background: black;
      width: 4px;
      height: 4px;
    }
    
    .ghost-eye.left { left: 3px; }
    .ghost-eye.right { right: 3px; }
    .ghost.A { background: #ff0000; }
    .ghost.B { background: #ffb8ff; }
    .ghost.C { background: #00ffff; }
    .ghost.D { background: #ffb847; }

    /* Controles del AG */
    #controles-ag {
      margin: 20px 0; 
      padding: 15px; 
      border: 1px solid #444;
      border-radius: 5px;
      background: #111;
      max-width: 600px;
      text-align: center;
    }

    #controles-ag h3 {
      color: #ffeb3b;
      margin-top: 0;
    }

    #controles-ag button {
      background: #004bff;
      color: white;
      border: none;
      padding: 10px 20px;
      margin: 0 10px;
      border-radius: 5px;
      cursor: pointer;
      font-size: 1rem;
    }

    #controles-ag button:hover {
      background: #0033cc;
    }

    #controles-ag button:disabled {
      background: #666;
      cursor: not-allowed;
    }

    #info-ag {
      margin-top: 15px;
      padding: 10px;
      background: #222;
      border-radius: 5px;
      font-family: monospace;
    }

    #progreso-ag {
      margin-top: 10px;
    }

    .metricas {
      display: grid;
      grid-template-columns: 1fr 1fr 1fr;
      gap: 10px;
      margin-top: 10px;
    }

    .metrica {
      background: #333;
      padding: 8px;
      border-radius: 5px;
      text-align: center;
    }

    @keyframes parpadeo {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.5; }
    }
  </style>
</head>

<body>
  <h1>Pacman - Algoritmo Genético</h1>
  
  <div id="controles-ag">
    <h3>Algoritmo Genético</h3>
    <div>
      <button id="btnIniciarAG">Iniciar Evolución</button>
      <button id="btnDemoMejor" disabled>Ver Mejor Individuo</button>
    </div>
    
    <div id="info-ag">
      <div>Estado: <span id="estado-ag">Listo para iniciar</span></div>
      <div id="progreso-ag"></div>
      <div class="metricas">
        <div class="metrica">Generación: <span id="generacionActual">0</span>/<span id="totalGeneraciones">50</span></div>
        <div class="metrica">Mejor Fitness: <span id="mejorFitness">-</span></div>
        <div class="metrica">Promedio Fitness: <span id="promedioFitness">-</span></div>
      </div>
    </div>
  </div>

  <div id="ui">
    <span id="puntuacion">Puntuación: 0</span>
    <span id="estado">Demo del Mejor Individuo</span>
  </div>
  <div id="game" class="game"></div>
  
  <script src="script.js"></script>
  <script src="ag.js"></script>
</body>
</html>
