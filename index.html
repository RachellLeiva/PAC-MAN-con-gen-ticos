<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <title>Pacman</title>
  <style>
    /* 🎨 Tu CSS igual que antes */
    body {
      margin: 0;
      min-height: 100vh;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: system-ui, sans-serif;
    }

    h1 {
      margin-bottom: 20px;
      font-size: 2.5rem;
      color: #ffeb3b;
      text-shadow: 0 0 10px #ffeb3b;
    }

    .game {
      display: grid;
      background: #000;
      padding: 10px;
      border-radius: 20px;
      border: 4px solid #004bff;
      box-shadow: 0 0 25px #004bff;
    }

    .tile { width: 20px; height: 20px; position: relative; }
    .wall { background: #001b99; border-radius: 6px; box-shadow: 0 0 6px #004bff inset; }
    .path { background: #000; }
    .path .dot {
      position: absolute; width: 4px; height: 4px; border-radius: 50%;
      background: #fff; top: 50%; left: 50%; transform: translate(-50%, -50%);
    }
    .empty { background: #000; }
    .pacman {
      width: 20px; height: 20px; background: #ffeb3b; border-radius: 50%;
    }
    .ghost {
      position: relative; border-radius: 50% 50% 10% 10%;
      width: 100%; height: 100%; overflow: hidden;
    }
    .ghost::before {
      content: ''; position: absolute; width: 100%; height: 50%;
      background: inherit; bottom: 0;
      clip-path: polygon(0 60%, 12% 100%, 25% 60%, 37% 100%, 50% 60%, 62% 100%, 75% 60%, 87% 100%, 100% 60%);
    }
    .ghost-eye {
      position: absolute; top: 4px; width: 6px; height: 6px;
      background: #fff; border-radius: 50%;
    }
    .ghost-eye::after {
      content: ''; position: absolute; width: 3px; height: 3px;
      background: #00f; border-radius: 50%; top: 1px; left: 1px;
    }
    .ghost-eye.left { left: 3px; }
    .ghost-eye.right { right: 3px; }
    .ghost.A { background: #ff0000; }
    .ghost.B { background: #ffb8ff; }
    .ghost.C { background: #00ffff; }
    .ghost.D { background: #ffb847; }
  </style>
</head>

<body>
  <h1>Pacman</h1>
  <div id="game" class="game"></div>

  <!-- ⚙️ Aquí conectas el script externo -->
  <script src="script.js"></script>
</body>
</html>
